# Dependabot: npm (pnpm) / Cargo / GitHub Actions
# PR の向き先は feature/core（main への直接 PR は作らない）
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly" # 毎週月曜に確認
      day: "monday"
    target-branch: "feature/core"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      radix-ui:
        patterns:
          - "@radix-ui/*"
      tauri:
        patterns:
          - "@tauri-apps/*"
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
          - "@chromatic-com/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "tailwindcss-animate"
          - "tw-animate-css"
      commitlint:
        patterns:
          - "@commitlint/*"
    ignore:
      # メジャー更新は自動PRしない（破壊的変更は人手で判断）
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # vitest 本体と揃えないと CI が壊れるため、関連パッケージのメジャーも除外
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "feature/core"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "rust"
    groups:
      tauri:
        patterns:
          - "tauri"
          - "tauri-build"
          - "tauri-plugin-*"
      serde:
        patterns:
          - "serde"
          - "serde_json"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "feature/core"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
